[project]
name = "after-afdc-analysis"
version = "1.0.0"
description = "Moderation test: post-1996 erosion of state cash assistance and the presidential-vote response to the China trade shock"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pyreadr>=0.5",
    "xlrd>=2.0",
    "openpyxl>=3.1",
    "linearmodels>=6.0",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
