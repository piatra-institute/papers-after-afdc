- id: rodrik-insurance
  kind: source
  passage: Ruggie's account of embedded liberalism describes a postwar settlement in which liberal trade was made politically durable by domestic social protection [@ruggie1982], and Rodrik reads the association between openness and government size as a demand for insurance against external risk [@rodrik1998].
  evidence:
    citation_id: rodrik1998
    locator: Abstract
    depth: abstract
    verified: false
    verification_note: Abstract read via Semantic Scholar record of the JPE article. Ruggie's embedded liberalism is cited for its well-known content only (title read; full text not inspected), so it carries no source claim.
    quote: One explanation is that government spending plays a risk-reducing role in economies exposed to a significant amount of external risk.
- id: hays-embedded
  kind: source
  passage: Hays, Ehrlich and Peinhardt test the thesis's critical assumption, that programs protecting those harmed by imports reduce opposition to free trade, and find support for it with individual and national data from OECD countries [@hays2005]; Walter traces the individual-level chain from globalization losses through economic insecurity to support for welfare expansion and for the Social Democratic Party in Switzerland [@walter2010].
  evidence:
    citation_id: hays2005
    locator: Abstract
    depth: abstract
    verified: false
    verification_note: Abstract read from the Crossref record.
    quote: We provide a micro-level test of the critical assumption behind the embedded liberalism thesis that government programs designed to protect individuals harmed by imports reduce opposition to free trade. ... We find empirical support for the embedded liberalism thesis in both our micro- and macro-level analyses.
- id: walter-micro
  kind: source
  passage: Hays, Ehrlich and Peinhardt test the thesis's critical assumption, that programs protecting those harmed by imports reduce opposition to free trade, and find support for it with individual and national data from OECD countries [@hays2005]; Walter traces the individual-level chain from globalization losses through economic insecurity to support for welfare expansion and for the Social Democratic Party in Switzerland [@walter2010].
