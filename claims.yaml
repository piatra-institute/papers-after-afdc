- id: abstract-tpr-1996
  kind: computation
  passage: After the 1996 welfare law, families receiving cash assistance per 100 poor families with children fell in every contiguous state, from an average of 68 in 1995–96 to 20 in 2015–16, unevenly.
  evidence:
    file: simulation/output/results.json
    run_id: analysis
    pointer: /descriptives/tpr_1996_state_mean
    reported: '68'
    scale: 1
    decimals: 0
    units: families aided per 100 poor families with children, unweighted mean of 48 states
    conditions: Recorded run 'analysis'; 3,106 counties in 48 contiguous states; 2SLS with state fixed effects, weighted by 2000 votes, intervals two-way clustered by state and commuting zone, t(47), unless the pointer names another statistic.
