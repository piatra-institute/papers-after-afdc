- id: crs-participation
  kind: source
  passage: The Congressional Research Service estimates that 81.6% of AFDC-eligible individuals received benefits in 1995 and 26.6% of TANF-eligible individuals in 2016, and that cash assistance closed 27.3% of the aggregate poverty gap of families with children in 1995 against 5.7% in 2016 [@crs2019].
  evidence:
    citation_id: crs2019
    locator: Section 'The TANF Caseload Decline and Child Poverty', text preceding Figure 7
    depth: fulltext
    verified: false
    verification_note: Read the full report text (everycrsreport.com HTML mirror, retrieved 2026-11-18). The participation figures are TRIM3 microsimulation estimates.
    quote: In 1995, 81.6% of estimated AFDC-eligible individuals received benefits. In 2016, 26.6% of people estimated to be eligible for TANF cash assistance received benefits.
- id: crs-poverty-gap
  kind: source
  passage: The Congressional Research Service estimates that 81.6% of AFDC-eligible individuals received benefits in 1995 and 26.6% of TANF-eligible individuals in 2016, and that cash assistance closed 27.3% of the aggregate poverty gap of families with children in 1995 against 5.7% in 2016 [@crs2019].
  evidence:
    citation_id: crs2019
    locator: Table 4 and the paragraph preceding it
    depth: fulltext
    verified: false
    verification_note: 'Read Table 4 (pre- and post-assistance poverty gaps for families with children, constant 2016 dollars): percentage reduction 27.3% in 1995 and 5.7% in 2016. Static accounting from TRIM3, not a causal estimate.'
    quote: In 1995, AFDC reduced the poverty gap by over $24 billion (more than 27% of the pre-assistance poverty gap of approximately $90 billion). ... In 2016, TANF cash assistance reduced the poverty gap by approximately $4 billion, or 5.7%.
- id: adh-transfers
