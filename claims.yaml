- id: nizalova-interaction
  kind: source
  passage: If the instrumented shock is as good as randomly assigned given the controls, $\gamma$ consistently measures how the shock effect varies with erosion even when erosion itself is correlated with omitted state traits [@nizalova2016; @bun2019].
  evidence:
    citation_id: nizalova2016
    locator: Abstract
    depth: abstract
    verified: false
    verification_note: Abstract read from the Crossref record. The paper states the result for OLS with an exogenous treatment; its application here to the instrumented shock is this paper's assumption.
    quote: We find that if the source of heterogeneity and omitted variable are jointly independent of policy or treatment, then the OLS estimate on the interaction term between the treatment and endogenous factor turns out to be consistent.
- id: bun-harrison
  kind: source
  passage: If the instrumented shock is as good as randomly assigned given the controls, $\gamma$ consistently measures how the shock effect varies with erosion even when erosion itself is correlated with omitted state traits [@nizalova2016; @bun2019].
