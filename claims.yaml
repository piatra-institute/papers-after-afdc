- id: abstract-bridge
  kind: interpretation
  passage: In 2016 votes, the interval includes changes larger than the Michigan, Wisconsin and Pennsylvania margins in both directions, so county data cannot settle whether erosion's amplification of the trade-shock effect changed those states.
  rationale: For all three states and both counterfactuals, the upper end of the margin-change interval exceeds the FEC margin and the lower end is a loss several times larger (/bridge/counterfactuals/*/states/*/ci_includes_flip = true). The bridge uses only the interaction channel.
- id: abstract-limit
  kind: interpretation
  passage: The main limits are a moderator that mostly records 1996 coverage and a program that reached few displaced workers.
  rationale: Erosion correlates 0.81 with the 1995-96 ratio (/descriptives/corr_erosion_tpr1996_states); TANF serves families with children (PRWORA sec. 408(a)(1)); family assistance did not respond measurably to the shock (/revision1/first_stage_transfers/d_fa_pc).
