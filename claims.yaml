    quote: whenever functional form identification is not valid, the ordinary least squares (OLS) estimator of the coefficient of the interaction term is consistent and standard OLS inference applies.
- id: identification-assumption
  kind: assumption
  passage: If the instrumented shock is as good as randomly assigned given the controls, $\gamma$ consistently measures how the shock effect varies with erosion even when erosion itself is correlated with omitted state traits [@nizalova2016; @bun2019].
  rationale: Conditional exogeneity of the ADHM instrument (shift-share exposure built from Chinese imports into other high-income countries) given the ADHM controls and state fixed effects.
- id: causal-reading-assumption
  kind: assumption
  passage: Reading $\gamma$ as the effect of changing a state's cash protection requires the further assumption that erosion is not standing in for some other state characteristic that conditions the response to job loss.
  rationale: Required for the bridge to 2016; not testable within this design. The competing-moderator checks (R5) address observed proxies only.
