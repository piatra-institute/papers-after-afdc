abstract: After the 1996 welfare law, families receiving cash assistance per 100 poor families with children
  fell in every contiguous state, from an average of 68 in 1995–96 to 20 in 2015–16, unevenly. If cash
  insurance shapes how voters respond to job loss, counties in states that lost more of it should have
  shifted further toward the Republican presidential candidate after the same local trade shock. The test
  regresses, on public data, the 2000–2016 change in the county Republican two-party share on instrumented
  commuting-zone exposure to Chinese import competition, interacted with the erosion of the state AFDC/TANF-to-poverty
  ratio, with state fixed effects. Across 3,106 counties the interaction is $-0.61$ points of Republican
  share per point of import penetration per standard deviation of erosion, with a 95% interval from $-1.56$
  to 0.33. Across specifications the upper bound ranges from 0.20 to 1.03, against a shock effect of 1.30
  at mean erosion, so only very large amplification is excluded. A first-stage check with county transfer
  data detects no response of family-assistance payments to the shock (0.98 dollars per capita per point,
  interval $-6.36$ to 8.32) and no moderation of that response by erosion ($-0.60$ per standard deviation,
  interval $-3.91$ to 2.72). In 2016 votes, the interval includes changes larger than the Michigan, Wisconsin
  and Pennsylvania margins in both directions, so county data cannot settle whether erosion's amplification
  of the trade-shock effect changed those states. The main limits are a moderator that mostly records
  1996 coverage and a program that reached few displaced workers.
checks: 2026-11
web_blurb: After the 1996 welfare law, cash assistance reached far fewer poor families, by very different
  amounts across states. Public county data show no evidence that steeper erosion amplified the Republican
  shift in counties hit by Chinese import competition, nor that family assistance responded to the shock,
  and cannot settle whether erosion changed the 2016 results in Michigan, Wisconsin or Pennsylvania.
